<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD700">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미국 체험학습">
<meta name="format-detection" content="telephone=no">
<title>미국 동부 체험학습</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#fff;--ink:#000;--ink-2:#5B6270;--soft:#D9D9D9;--hair:#E6E8EC;--wash:#F7F8FA;
  --gold:#FFD700;--gold-deep:#E8BE00;--yel:#FFF2CC;--red:#E00000;--us:#1D3FD6;--kr:#C8102E;
  --k1:#DDE4F6;--k2:#D9E5DD;--k3:#E8DDF2;--k4:#E8E0D2;--k5:#F3DFE8;
  --shadow:0 1px 2px rgba(17,24,39,.06),0 14px 32px -18px rgba(17,24,39,.35);
  --f-serif:"Noto Serif KR","Batang","AppleMyungjo",serif;
  --f-sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --c:#111;color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:15.5px;line-height:1.65;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:0;background:none;padding:0;color:inherit;text-align:left}
a{color:inherit}
:focus-visible{outline:3px solid #2447D6;outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 70px}

/* 머리말 */
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:.8rem}
.top .tt{flex:1;min-width:240px;display:grid;gap:.15rem}
.kick{font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
.ttl{justify-self:start;font-family:var(--f-serif);font-weight:700;font-size:clamp(1.5rem,5vw,2rem);line-height:1.3;background:linear-gradient(transparent 60%,var(--gold) 60%);padding-inline:.15em;margin-inline:-.15em}
.who{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2)}
.who b{color:var(--ink)}
.clk b{font-variant-numeric:tabular-nums}
.clk i{font-style:normal;font-weight:700}
.clk .u{color:var(--us)}.clk .k{color:var(--kr)}

/* 버튼 */
.bt{font-weight:700;font-size:.92rem;min-height:44px;padding:.3rem 1.1rem;border:1px solid #111;background:var(--paper);color:var(--ink);border-radius:999px;box-shadow:0 2px 0 #111;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:.4rem;text-decoration:none}
.bt:active{transform:translateY(2px);box-shadow:0 0 0 #111}
.bt.gold{background:var(--gold)}
.bt:disabled{opacity:.35;box-shadow:none;cursor:default}
.mini{font-size:.82rem;font-weight:500;border:1px solid var(--soft);background:var(--paper);color:var(--ink-2);min-height:32px;padding:0 .8rem;border-radius:999px;display:inline-flex;align-items:center;text-decoration:none}
.mini:hover{color:var(--ink);border-color:var(--ink-2)}
.mini.dg{color:#b3122b}.mini.pr{background:#111;color:#fff;border-color:#111}

/* 탭 */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding-block:.35rem .6rem}
.seg{display:flex;gap:4px;padding:4px;background:#F1F2F5;border-radius:16px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:.9rem;min-height:46px;padding:.25rem .85rem;border-radius:12px;line-height:1.25;text-align:center;white-space:nowrap}
.tab small{display:block;font-weight:500;font-size:.72rem;opacity:.85}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--gold);color:#000;box-shadow:0 1px 2px rgba(0,0,0,.2),0 4px 10px -4px rgba(232,190,0,.9)}
.tab-sep{flex:none;width:1px;background:#d6d9e0;margin:8px 3px}

.panelx{padding-top:.5rem}
h2.h{font-family:var(--f-serif);font-size:1.3rem;font-weight:700}
h3.h{font-size:1.05rem;font-weight:700}
.hint{color:var(--ink-2);font-size:.9rem}

/* 이름 입력 */
.gate{min-height:70vh;display:grid;place-items:center}
.gcard{width:min(460px,100%);display:grid;gap:1rem;padding:1.6rem;border:1px solid #111;border-radius:22px;box-shadow:0 12px 28px -12px rgba(0,0,0,.35)}
.gcard input{font-size:1.1rem;min-height:52px;padding:.3rem 1rem;border:1px solid #111;border-radius:14px;width:100%}
.gerr{color:#b3122b;font-size:.9rem;min-height:1.3rem}
.gcard .row2{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* 홈: 버스 */
.hbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem;margin:.4rem 0 1rem}
.hbar h2{font-family:var(--f-serif);font-size:clamp(1.3rem,4vw,1.7rem);font-weight:700}
.hbar h2 b{background:linear-gradient(transparent 60%,var(--gold) 60%);padding-inline:.15em;margin-inline:-.15em}
.hbar .seatbig{font-weight:700;font-size:1.05rem}
.homegrid{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px;align-items:start}
.bsel{display:flex;gap:6px;margin-bottom:.7rem}
.bsel .bt{min-height:40px;box-shadow:none}
.bsel .bt[aria-pressed="true"]{background:var(--gold)}
.bus{background:#FBFAF6;border:3px solid #3a2f27;border-radius:26px;padding:12px 14px 14px}
.bus .hd{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-2);font-weight:700;padding:2px 6px 8px;border-bottom:1px dashed #b9b3a6;margin-bottom:10px}
.seats{display:grid;grid-template-columns:1fr 1fr 26px 1fr 1fr;gap:7px 6px;align-items:stretch}
.rn{display:grid;place-items:center;font-size:.72rem;color:var(--ink-2)}
.seat{border:1px solid rgba(0,0,0,.14);border-radius:11px;padding:3px 8px 4px;min-height:48px;background:#f2f2f2;display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.25}
.seat .sn{font-size:.68rem;color:#6b6b6b;font-variant-numeric:tabular-nums}
.seat b{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .st{color:#d4380d}
.seat.k1{background:var(--k1)}.seat.k2{background:var(--k2)}.seat.k3{background:var(--k3)}.seat.k4{background:var(--k4)}.seat.k5{background:var(--k5)}
.seat.tch{background:#111;color:#fff;border-color:#111}.seat.tch .sn{color:#bbb}
.seat.sta{background:#E6DFD1}
.seat.emp{background:transparent;border:1px dashed #cfcab9}
.seat.org{background:#E8590C;color:#000;border:2px solid #111}
.seat.me{background:var(--gold);color:#000;border:3px solid #000;box-shadow:0 0 0 3px rgba(255,215,0,.45),0 8px 16px -6px rgba(0,0,0,.45);position:relative;z-index:1;animation:pop .5s ease-out}
.seat.me .tagme{position:absolute;right:-6px;top:-10px;background:#000;color:var(--gold);font-size:.66rem;font-weight:700;border-radius:999px;padding:0 8px;line-height:1.6}
.seat.nb{outline:2px dashed #111;outline-offset:-3px}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.wc{grid-column:4/6;grid-row:span 2;background:#E6DFD1;border:1px dashed #b9b3a6;border-radius:11px;display:grid;place-items:start center;padding-top:8px;font-size:.78rem;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin-top:12px;font-size:.78rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:inline-block}

/* 표 (참고 html의 표 느낌) */
table.w{width:100%;border-collapse:collapse;font-size:.93rem;background:#fff}
table.w th,table.w td{border:1px solid #000;padding:.4em .65em;vertical-align:middle}
table.w th{background:var(--gold);font-weight:700;text-align:center}
table.w td.k{background:var(--yel);font-weight:700;white-space:nowrap;width:1%}
table.w td.c{text-align:center}
table.w tr.me td{background:var(--yel)}
table.w tr.me td:first-child{box-shadow:inset 4px 0 0 #000}
.tblwrap{overflow-x:auto}
.cap{font-family:var(--f-serif);font-weight:700;font-size:1.02rem;margin:1.1rem 0 .4rem}
.me-info td.k{width:92px}

/* 일정 */
.dh{display:grid;gap:.3rem;padding-bottom:.6rem}
.dh .k{font-size:.82rem;font-weight:700;color:var(--ink-2)}
.dh h1{justify-self:start;font-family:var(--f-serif);font-weight:700;font-size:clamp(1.4rem,4vw,1.9rem);line-height:1.3;background:linear-gradient(transparent 60%,var(--gold) 60%);padding-inline:.15em;margin-inline:-.15em}
.dh p{color:var(--ink-2);font-size:.92rem}
.dh .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.25rem}
.chip{font-size:.8rem;border:1px solid #111;background:var(--yel);color:var(--ink);min-height:28px;padding:0 .75rem;border-radius:999px;display:inline-flex;align-items:center}
.chip.plain{background:#fff}
.stage{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;margin-top:.9rem;align-items:start}
.line{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;border:1px solid #000;border-radius:14px;background:#fff;scrollbar-width:thin}
.stop{display:grid;grid-template-columns:78px 1fr;gap:10px;width:100%;padding:11px 14px;border-bottom:1px solid var(--hair);align-items:start}
.stop:last-of-type{border-bottom:0}
.stop:hover{background:var(--wash)}
.stop.on{background:var(--yel);box-shadow:inset 5px 0 0 var(--gold-deep)}
.stop .tr{display:flex;flex-direction:column;line-height:1.3;font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ink-2)}
.stop .tr b{font-size:.98rem;color:#000;font-weight:700}
.stop .nm{display:block;font-weight:700;font-size:.93rem;line-height:1.45}
.stop .mt{display:block;margin-top:2px;font-size:.78rem;color:var(--ink-2)}
.z{font-style:normal;font-weight:700}.z.EDT{color:var(--us)}.z.KST{color:var(--kr)}
.tg{display:inline-block;font-size:.68rem;font-weight:700;border:1px solid #111;border-radius:999px;padding:0 .5rem;margin-left:.35rem;background:#fff;vertical-align:1px}
.tg.mn{background:var(--gold)}
.panel{border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);padding:24px 28px;min-width:0;background:#fff}
.kind{font-size:.82rem;font-weight:700;color:var(--ink-2)}
.panel h2{font-family:var(--f-serif);font-size:clamp(1.3rem,3vw,1.65rem);line-height:1.4;font-weight:700;margin-top:2px}
.timetbl{margin:1rem 0 .9rem}
.timetbl td{font-family:var(--f-serif);font-weight:700;font-size:1.25rem;text-align:center;padding:.5em .6em}
.timetbl td small{display:block;font-family:var(--f-sans);font-weight:500;font-size:.78rem;color:var(--ink-2)}
.timetbl th.u{color:var(--us)}.timetbl th.k{color:var(--kr)}
.loc{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .7rem;margin:0 0 1rem;padding:.6rem .9rem;background:var(--wash);border:1px solid var(--hair);border-radius:12px;font-size:.9rem}
.loc b{font-weight:700}.loc span{color:var(--ink-2)}
.sh{font-family:var(--f-serif);font-weight:700;font-size:1.05rem;margin:1.2rem 0 .5rem}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:.45rem;max-width:80ch}
.pts li{position:relative;padding-left:1.3rem}
.pts li::before{content:"";position:absolute;left:.2rem;top:.7em;width:.45rem;height:.45rem;border-radius:50%;background:#000}
.gh{margin:1.7rem 0 .7rem;padding-top:1.2rem;border-top:1px solid #000}
.gh h3{font-family:var(--f-serif);font-size:1.15rem;font-weight:700}
.gh p{color:var(--ink-2);font-size:.88rem;margin-top:2px;max-width:80ch}
.sg{margin:.9rem 0 .5rem;font-weight:700;font-size:.9rem;color:var(--ink-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.spot{border:1px solid #111;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:.5rem;background:#fff;min-width:0}
.spot h4{font-size:1rem;font-weight:700;line-height:1.4}
.spot .ty{display:inline-block;font-size:.72rem;font-weight:700;background:var(--yel);border:1px solid #111;border-radius:999px;padding:0 .55rem;margin-left:.4rem;vertical-align:2px}
.spot ul.d{margin:0;padding-left:1.1rem;font-size:.9rem;color:#333}
.menu{display:flex;flex-wrap:wrap;gap:.3rem;margin:0;padding:0;list-style:none}
.menu li{font-size:.8rem;background:var(--wash);border:1px solid var(--hair);border-radius:999px;padding:0 .65rem}
.price{font-weight:700;font-size:.9rem}
.tip{font-size:.82rem;color:var(--ink-2);border-left:3px solid var(--gold);padding-left:.6rem}
.lk{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto;padding-top:.2rem}
.phs{margin-top:1.8rem;padding-top:1.2rem;border-top:1px solid #000}
.ph{display:flex;gap:8px;flex-wrap:wrap}
.th{width:100px;height:100px;border-radius:10px;object-fit:cover;cursor:zoom-in;border:1px solid var(--hair)}
.add{width:100px;height:100px;border-radius:10px;border:1px dashed #9aa0ad;color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:.78rem;text-align:center}
.add:hover{border-color:#000;color:#000;background:var(--yel)}
.pn{display:flex;justify-content:space-between;gap:.6rem;margin-top:1.6rem;padding-top:1rem;border-top:1px solid #000}
.mbox{border:1px solid #000;border-radius:14px;padding:14px 16px;margin:1rem 0;background:#fff}
.mbox .cap{margin-top:0}
.mem{display:flex;flex-wrap:wrap;gap:.3rem;margin:.5rem 0 0;padding:0;list-style:none}
.mem li{font-size:.84rem;border:1px solid var(--hair);background:var(--wash);border-radius:999px;padding:0 .7rem}
.mem li.me{background:var(--gold);border-color:#000;font-weight:700}
details.all{margin-top:.6rem}
details.all summary{cursor:pointer;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.ed{display:none;gap:.4rem;margin-top:.7rem;flex-wrap:wrap}
body.edit .ed{display:flex}
.only-edit{display:none}body.edit .only-edit{display:inline-flex}
body.edit .panel{outline:2px dashed #888;outline-offset:4px}

/* 정보 · 사진첩 */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:.8rem}
.card{border:1px solid #000;border-radius:14px;padding:16px 18px;background:#fff;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{font-family:var(--f-serif);font-size:1.05rem;font-weight:700;margin-bottom:.5rem}
.ck{display:flex;gap:.6rem;align-items:center;padding:2px 0}
.ck input{width:1.15rem;height:1.15rem;accent-color:#000}
.ck.done span{text-decoration:line-through;color:var(--ink-2)}
.cols2{columns:2;column-gap:28px}.cols2 .ck{break-inside:avoid}
.eng div{padding:.35rem 0;border-bottom:1px solid var(--hair);font-size:.9rem}
.eng small{display:block;color:var(--ink-2);font-size:.78rem}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;font:inherit;border:1px solid #111;background:#fff;border-radius:12px;padding:.45rem .75rem;color:var(--ink);min-height:42px}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.drop{border:1px dashed #9aa0ad;border-radius:16px;padding:20px;text-align:center;background:var(--wash)}
.sub{display:flex;gap:6px;margin:.9rem 0;flex-wrap:wrap}
.pill{border:1px solid #111;background:#fff;border-radius:999px;padding:.2rem .85rem;font-size:.84rem;font-weight:700}
.pill.on{background:var(--gold)}
.alb{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.alb figure{margin:0;cursor:zoom-in}
.alb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--hair)}
.alb figcaption{font-size:.75rem;color:var(--ink-2);padding:3px 2px;line-height:1.3}
.empty-s{color:var(--ink-2);padding:26px;text-align:center}


/* 길 안내 · 식당 */
.geo{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem;padding:.5rem 0 .2rem}
.geo .bt{min-height:40px;font-size:.85rem}
.geo .gs{font-size:.82rem;color:var(--ink-2);flex:1;min-width:180px}.geo .gs.err{color:#b3122b}
.modes{display:flex;gap:4px}
.pill{cursor:pointer}
.locw{margin:0 0 1rem}.locw .loc{margin:0}
.emb{width:100%;height:320px;border:1px solid #000;border-radius:12px;margin-top:.5rem;background:var(--wash)}
.spot .ty.plain{background:#fff}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px .7rem;margin:0;font-size:.84rem}
.meta dt{font-weight:700;color:var(--ink-2)}.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.vf{font-size:.78rem;line-height:1.5;border-radius:10px;padding:.35rem .6rem;border:1px solid var(--hair);background:var(--wash);color:var(--ink-2)}
.vf.ok::before{content:"확인 · ";font-weight:700;color:#0a7a3b}
.vf.no{background:#FFF7E0;border-color:#E8BE00}.vf.no::before{content:"주의 · ";font-weight:700;color:#8a5a00}
.sph{display:flex;gap:6px;flex-wrap:wrap}.sph .th,.sph .add{width:64px;height:64px;border-radius:8px}
.sph .add{font-size:.68rem}
.cap+.sg{margin-top:.3rem}


/* 지금 · 식사 · 색 */
.now{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.2rem 0 .3rem;padding:.55rem .8rem;border:1px solid #000;border-radius:14px;background:var(--yel)}
.now .nt{display:grid;text-align:left;gap:0;flex:1;min-width:200px;line-height:1.35}.now .nt b{font-size:.98rem}.now .nt small{font-size:.78rem;color:var(--ink-2)}
.now .nx{font-size:.82rem;color:var(--ink-2);text-align:left}.now .nx small{font-size:.74rem}
.tg.nw{background:var(--red);color:#fff;border-color:var(--red);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
.tg.fm{background:#E11D74;color:#fff;border-color:#E11D74}
.ml{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:0 .55rem;margin-right:.35rem;vertical-align:1px;border:1px solid rgba(0,0,0,.25)}
.ml.b{background:#FFE9A8;color:#6b4500}.ml.l{background:#FFCF9E;color:#8a3d00}.ml.d{background:#D9CCFF;color:#3b2a8f}
.ml.big{font-size:.85rem;padding:.05rem .75rem;margin-right:.6rem;vertical-align:3px}
.stop .kd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--kc);margin-right:6px;vertical-align:1px}
.stop.meal:not(.on){background:#FFF8EC}.stop.freeml:not(.on){background:#FFEAF3}
.stop.freeml{box-shadow:inset 4px 0 0 #E11D74}.stop.freeml.on{box-shadow:inset 5px 0 0 #E11D74}
.stop.past:not(.on){opacity:.55}
.stop.now:not(.on){background:#FFF1F1}.stop.now{box-shadow:inset 5px 0 0 var(--red)}
.panel{border-top:5px solid var(--kc,#111)}
.dh{border-top:6px solid var(--c,#111);padding-top:.7rem}
.dact{display:flex;gap:.4rem;flex-wrap:wrap}
.fmb{margin:.8rem 0 0;padding:.65rem .9rem;border-radius:12px;background:#FFE3EF;border:2px solid #E11D74;font-size:.92rem}
.fmb b{background:#E11D74;color:#fff;border-radius:999px;padding:0 .7rem;margin-right:.4rem;font-size:.82rem}
.fmb.grp{background:#FFF4DD;border-color:#F59E0B}.fmb.grp b{background:#F59E0B;color:#000}
.fmb.grp.d{background:#EEE9FF;border-color:#7C5CFF}.fmb.grp.d b{background:#7C5CFF;color:#fff}
.gfood .gh{background:#FFF4DD;border:1px solid #F59E0B;border-radius:12px;padding:.8rem 1rem;margin-top:1.5rem}
.spot.food{background:#FFFBF0;border-left:6px solid #F59E0B}
.spot.food h4{font-size:1.05rem}
.spot.food .ty{background:#FFD98A}
.pf{margin:0;width:100px}.pf .th{display:block}
.pf figcaption{font-size:.72rem;line-height:1.3;color:var(--ink-2);padding-top:2px;overflow-wrap:anywhere}
.pf.sm{width:76px}.pf.sm .th{width:76px;height:64px}

function seatH(x,me,mine){
 let c="seat";
 if(x.t==="teacher")c+=" tch";else if(x.t==="staff"||x.t==="guide")c+=" sta";else if(x.t==="empty")c+=" emp";
 else if(x.org)c+=" org";else if(x.id)c+=" k"+SN[x.id].c;
 const isMe=mine&&mine.s.s===x.s&&mine.bus===ui.bus;
 if(isMe)c+=" me";else if(mine&&mine.bus===ui.bus&&x.s===partner(mine.s.s)&&x.t!=="empty")c+=" nb";
 return `<div class="${c}"><span class="sn">${x.s}${x.star?' <span class="st">★</span>':""}</span><b>${esc(x.n)}</b>${isMe?'<span class="tagme">내 자리</span>':""}</div>`}
function busH(b,mine){
 const by={};BUS[b].forEach(x=>by[x.s]=x);let g="";
 for(let r=1;r<=15;r++){
  const L=r<=13?[(r-1)*4+1,(r-1)*4+2]:[53+(r-14)*2,54+(r-14)*2];
  g+=L.map(n=>by[n]?seatH(by[n],ME,mine):"").join("")+`<div class="rn">${r}</div>`;
  if(r<=13)g+=[(r-1)*4+3,(r-1)*4+4].map(n=>by[n]?seatH(by[n],ME,mine):"").join("");
  else if(r===14)g+=`<div class="wc">화장실</div>`}
 return `<div class="bus"><div class="hd"><span>운전석</span><span>출입구</span></div><div class="seats">${g}</div></div>
 <div class="legend">${[1,2,3,4,5].map(k=>`<span><i style="background:var(--k${k})"></i>${k}반</span>`).join("")}<span><i style="background:#111"></i>선생님</span><span><i style="background:#E8590C"></i>수하물 도우미</span><span><i style="background:var(--gold);border-color:#000"></i>내 자리</span><span>★ 좌석표에 별 표시된 학생</span></div>`}

 if(mine){const p=seatPos(mine.s.s);bar=`<h2><b>${esc(ME.n)}</b> 님의 버스 자리</h2><span class="seatbig">${mine.bus}호차 ${mine.s.s}번 · ${p.row}열 ${COLN[p.col]}</span>`}

 lb.innerHTML=`<img id="shimg" src="${esc(shTh(p))}" alt="" style="opacity:.6"><div style="text-align:center;font-size:.9rem">${p.cap?`&lt;${esc(p.cap)}&gt; `:""}<small>${esc(p.name||"")}</small></div><div class="bar"><button class="bt" id="sp">◀</button><span style="align-self:center">${shV.i+1} / ${n}</span><button class="bt" id="sn">▶</button><a class="bt" id="so" href="${esc(shTh(p))}" target="_blank" rel="noopener">원본 열기</a>${mine?`<button class="bt" id="sx" style="color:#b3122b">삭제</button>`:""}<button class="bt gold" id="sc">닫기</button></div>`;
 $("#sp").onclick=()=>{shV.i=(shV.i+n-1)%n;showSh()};$("#sn").onclick=()=>{shV.i=(shV.i+1)%n;showSh()};$("#sc").onclick=()=>{lb.classList.remove("on");keepScroll(render)};
 if(mine)$("#sx").onclick=async()=>{if(!confirm("공용 앨범에서 이 사진을 지울까요?"))return;try{await SH.remove(p);shV.list.splice(shV.i,1);ui.sh.items=ui.sh.items.filter(x=>x.id!==p.id);Object.keys(ui.sh.own).forEach(k=>ui.sh.own[k]=ui.sh.own[k].filter(x=>x.id!==p.id));if(!shV.list.length){lb.classList.remove("on");keepScroll(render);return}shV.i=Math.min(shV.i,shV.list.length-1);showSh()}catch(e){toast("지우지 못했어요")}};
 try{const sh=await shLoad();const full=await sh.full(p);if(shV.list[shV.i]===p){const im=$("#shimg");if(im){im.src=full;im.style.opacity=1}const so=$("#so");if(so)so.href=full}}catch(e){}}

</script>
</body></html>
